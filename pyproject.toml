[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-choices"
version = "0.1.0"
description = "A daily choose-your-own-adventure series for TikTok and Reels: AI-written, AI-rendered, steered by comment votes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=2.4",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
choices = "choices.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/choices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
